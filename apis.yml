name: Fly By Jing
description: >-
  Fly By Jing is a premium Chinese food brand founded by James Beard Award-winning
  chef and entrepreneur Jing Gao in 2018, best known for its small-batch Sichuan
  Chili Crisp made in Chengdu without preservatives or added sugar. The company sells
  its signature sauces, noodles, gift sets, and pantry staples direct-to-consumer
  through a Shopify-powered storefront at flybyjing.com. From an API Evangelist
  perspective, the storefront exposes a real, live machine surface: a Shopify
  Storefront MCP server at /api/mcp (search_catalog, get_cart, update_cart,
  get_product_details, search_shop_policies_and_faqs) and a Shopify Customer Account
  API secured with OAuth 2.0 / OpenID Connect, discoverable via the domain's
  /.well-known/openid-configuration document. Surfaced originally as a Techstars
  portfolio lead and enriched here from live discovery probes of the store domain.
